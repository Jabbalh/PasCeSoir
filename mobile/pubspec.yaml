name: pas_ce_soir
description: Journal des réveils nocturnes d'un enfant, partagé entre parents.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.0.0
  flutter_quill: ^11.4.0
  flutter_svg: ^2.2.0
  go_router: ^16.0.0
  html: ^0.15.5
  # version imposée par flutter_localizations
  intl: any
  path: ^1.9.0
  share_plus: ^11.0.0
  shared_preferences: ^2.5.0
  sqflite: ^2.4.0
  supabase_flutter: ^2.9.0
  uuid: ^4.5.0
  sqflite_common_ffi_web: ^1.2.0
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.svg
    - assets/fonts/
